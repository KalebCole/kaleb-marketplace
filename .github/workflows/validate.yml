name: Validate marketplace

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic checks
        run: npm run check

  validate:
    if: ${{ always() }}
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          RESULT: ${{ needs.platform.result }}
        run: node -e "if (process.env.RESULT !== 'success') { console.error('Platform checks did not all pass (' + process.env.RESULT + ')'); process.exit(1); }"
